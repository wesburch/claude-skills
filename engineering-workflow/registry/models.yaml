# Current model registry: DATA ONLY.
#
# Stable policy (task shape -> capability class -> effort tier -> gates) lives in
# ../references/routing.md and names no models. This file maps classes to the
# models that currently satisfy them. Update it, never the workflow, when a
# model ships, retires, changes price or access, or gains evidence.
#
# Check drift/staleness (warn-only):  ../scripts/model-routing check
# Resolve a delegate for a class:      ../scripts/model-routing resolve --class <class>
#
# Status (routing status, independent of the vendor's lifecycle):
#   promoted  - eligible for automatic selection in the classes that list it in `order`
#   candidate - known; never auto-selected until local-eval evidence or an
#               explicit user choice promotes it (move it into `order`)
#   legacy    - callable, not selected for new work
#   retired   - no longer callable on the named host
#
# Two separate things are recorded about a model's standing:
#   vendor_lifecycle - what the VENDOR says, and nothing else:
#       current     - in the vendor's current lineup
#       listed      - on the vendor's model pages with no legacy or
#                     deprecation label, but not in the current lineup
#       legacy      - the vendor calls it legacy
#       deprecated  - the vendor has announced its retirement
#     Record only a label the vendor's pages support; cite the page.
#   workflow_status  - OUR view, independent of the vendor's:
#       transitional - occupies a class today for lack of an accessible,
#                      evidenced alternative; expected to be replaced when
#                      one clears the promotion bar. Routing is unaffected:
#                      `status` alone decides selection.
#
# Evidence tags: FIRST_PARTY, BENCHMARK, PRACTITIONER, PERSONAL, LOCAL_EVAL
# Confidence:    verified, plausible, anecdotal, unknown
# A behavior dimension without an evidence entry is `unknown`: leave it absent
# rather than guessing.

schema_version: 1
last_reviewed: 2026-09-30
refresh:
  max_age_days: 30
  triggers: [vendor_release, cli_update, registry_check_drift]

behavior_dimensions:
  - autonomy
  - ambiguity_tolerance
  - instruction_adherence
  - coding
  - repo_exploration
  - debugging
  - architecture
  - code_review
  - research
  - tool_use
  - computer_use
  - long_context
  - long_horizon
  - prompt_sensitivity
  - over_engineering
  - premature_stop
  - delegation
  - latency
  - token_consumption

# Policy effort tiers -> default model level. A model's `effort_map` overrides
# per tier because levels are recalibrated between model generations.
effort_tiers:
  light: low
  standard: medium
  deep: high
  extended: xhigh # gated: requires an escalation record (routing.md)
# `max` and `ultra` are not tiers: never selected automatically.

hosts:
  claude-code:
    detect_env: [CLAUDECODE]
    cli: [claude, $CLAUDE_CODE_EXECPATH]
    discovery:
      listed: Agent tool `model` enum (family aliases); `/model` picker
      alias_resolution: installed CLI version against `aliases` below
      observed: "`/tasks` shows each subagent's model and effort"
      api: GET /v1/models (requires an API key; not used during workflow)
    model_precedence: [per-invocation model (aliases only), agent frontmatter model, CLAUDE_CODE_SUBAGENT_MODEL, main session model]
    effort_control: agent frontmatter `effort` (no per-invocation effort; overrides the session level)
    fallback_behavior: "From 2.1.286, a refused model retries once on the previous model of the same tier: configured is not observed"
    read_only_enforcement: "fail-closed PreToolUse Bash guard (engineering-workflow/scripts/readonly-bash-guard) on read-only roles; permissionMode plan did not stop Bash writes under auto or bypass parents (smoke test 2026-09-30). Verified in fresh headless sessions (2.1.284 and 2.1.286); a desktop session running before install did not apply it"
    observation: {model_and_effort: "subagent transcript ~/.claude/projects/<cwd>/<session>/subagents/*.jsonl (model, effort)", usage: "claude -p --output-format json modelUsage"}
    last_discovery: {date: 2026-09-30, cli: {claude: 2.1.286, desktop: 2.1.284}}
    aliases: # ascending by min_cli; the last entry whose min_cli <= installed version applies
      opus:
        - {min_cli: 0.0.0, model: claude-opus-5}
        - {min_cli: 2.1.280, model: claude-opus-5-5}
      sonnet:
        - {min_cli: 0.0.0, model: claude-sonnet-5}
        - {min_cli: 2.1.284, model: claude-sonnet-5-5}
      haiku:
        - {min_cli: 0.0.0, model: claude-haiku-4-5-20251001}
      fable:
        - {min_cli: 2.1.257, model: claude-fable-5-1}
    sources:
      - https://code.claude.com/docs/en/model-config
      - https://code.claude.com/docs/en/sub-agents
  codex:
    detect_env: [CODEX_THREAD_ID, CODEX_SANDBOX]
    cli: [codex]
    discovery:
      accessible: ~/.codex/models_cache.json (account catalog; entries with visibility=list)
      listed: codex debug models --bundled (catalog shipped with the installed binary)
      observed: "`/agent` thread view; `codex exec --json` events"
    model_precedence: [custom agent file model, explicit spawn value, "[agents] default_subagent_model", parent model]
    effort_control: custom agent file model_reasoning_effort; "[agents] default_subagent_reasoning_effort"; spawn value
    delegate_service_tier: default # explicit standard routing; overrides the catalog default_service_tier
    delegate_mechanism: "engineering-workflow/scripts/codex-delegate: headless codex exec with --ignore-user-config, --ignore-rules, hooks and multi_agent disabled, and explicit model, effort, service_tier, sandbox, approvals never"
    in_process_children: "not isolated: inherit the parent's live service tier and sandbox overrides (smoke test 2026-09-30); not used for workflow roles"
    installed_roles: "real copies in ~/.codex/agents (Codex does not load symlinked agent files)"
    observation:
      model_effort_sandbox: rollout turn_context (~/.codex/sessions/**/*<thread_id>.jsonl)
      service_tier: "RUST_LOG=codex_exec=info,codex_otel=info: SessionConfiguredEvent and response.completed telemetry (request level; the server response field reported default for a priority request)"
    catalog_default_service_tier: priority # the Codex catalog's default for every model, observed 2026-09-30
    last_discovery:
      date: 2026-09-30
      cli: 0.159.2
      bundled: [gpt-6-astra, gpt-6.1-sol, gpt-6-sol, gpt-6-luna, gpt-5.6-sol, gpt-5.6-terra, gpt-5.6-luna, gpt-5.5]
    ignored_catalog_ids: [codex-auto-review, gpt-daybreak-blue-latest, gpt-daybreak-red-latest] # shipped in the bundled catalog; not routing candidates
    sources:
      - https://learn.chatgpt.com/docs/agent-configuration/subagents
      - https://learn.chatgpt.com/docs/agent-configuration/speed
      - https://github.com/openai/codex/blob/main/codex-rs/protocol/src/config_types.rs (SERVICE_TIER_DEFAULT_REQUEST_VALUE)

classes:
  efficient-bounded:
    claude-code:
      order: [{model: claude-sonnet-5, tier: light}]
      candidates:
        - {model: claude-sonnet-5-5, tier: light}
        - {model: claude-haiku-4-5-20251001, note: "no effort control; vendor retirement not before 2026-10-15"}
    codex:
      order: [{model: gpt-5.6-luna, tier: light}]
      candidates: [{model: gpt-6-luna, tier: light}]
    upward_fallback: capable-delegated
  capable-delegated:
    claude-code:
      order: [{model: claude-sonnet-5, tier: standard}]
      candidates: [{model: claude-sonnet-5-5, tier: standard}]
    codex:
      order:
        - {model: gpt-5.6-terra, tier: standard}
        - {model: gpt-5.6-sol, tier: standard}
      candidates: [{model: gpt-6.1-sol, tier: standard}]
    upward_fallback: frontier-judgment
  frontier-judgment:
    claude-code:
      order: [{model: claude-opus-5-5, tier: deep}]
      candidates: [{model: claude-fable-5-1, tier: deep}]
    codex:
      order:
        - {model: gpt-6-astra, tier: deep}
        - {model: gpt-5.6-sol, tier: deep}
      candidates: []
  primary-interactive:
    policy: user_choice # never auto-selected or auto-downgraded
    current_preference:
      claude-code: {model: claude-opus-5-5, alias: opus, effort: high}
      codex: {model: gpt-6-astra, effort: high, service_tier: user_choice}

# Bar a candidate must clear on local evals before promotion is proposed.
# Among passing models, prefer the lowest cost per successful task.
promotion:
  requires_one_of: [local_eval, explicit_user_choice]
  local_eval_bar:
    min_sample_size: 9 # valid samples for one model, effort and role; efforts are never pooled
    min_distinct_tasks: 3 # meaningfully different tasks; three trials on one task are preliminary
    max_pass_rate_drop_vs_incumbent: 0.05
    max_median_repair_loops: 1
    min_seeded_defect_recall: 1.0 # review categories: zero critical misses
  metric: cost_per_success_usd

# Reusable delegate roles. Agent files under ../../agents/ must match these
# values; `model-routing check` reports drift. Effort is set here, never inherited.
# A role changes to another role only through `escalates_to`, so an escalated
# assignment keeps its tool access; otherwise the role keeps its definition and
# the resolver supplies an explicit model.
roles:
  wf-explorer:
    class: efficient-bounded
    access: read-only
    claude-code: {model: claude-sonnet-5, effort: low}
    codex: {model: gpt-5.6-luna, effort: low, sandbox_mode: read-only, service_tier: default}
  wf-implementer:
    class: capable-delegated
    access: workspace-write
    claude-code: {model: claude-sonnet-5, effort: medium}
    codex: {model: gpt-5.6-terra, effort: medium, sandbox_mode: workspace-write, service_tier: default}
  wf-reviewer:
    class: capable-delegated
    access: read-only
    escalates_to: wf-reviewer-deep
    claude-code: {model: claude-sonnet-5, effort: medium}
    codex: {model: gpt-5.6-terra, effort: medium, sandbox_mode: read-only, service_tier: default}
  wf-reviewer-deep:
    class: frontier-judgment
    access: read-only
    claude-code: {model: claude-opus-5-5, effort: high}
    codex: {model: gpt-6-astra, effort: high, sandbox_mode: read-only, service_tier: default}

# local_eval entry schema (none recorded yet):
#   - {category, class, host, effort, date, sample_size, pass_rate,
#      median_cost_usd, cost_per_success_usd,
#      median_tokens: {input, cached_input, output},
#      median_repair_loops, median_wall_seconds, human_interventions,
#      unrelated_edits, seeded_defect: {recall, precision}, evidence_ref}

