# Engineering-workflow delegate role (registry role: wf-reviewer, class capable-delegated).
# Model and effort mirror engineering-workflow/registry/models.yaml; keep them in sync
# (`engineering-workflow/scripts/model-routing check` reports drift).
name = "wf-reviewer"
description = "Independent read-only reviewer for engineering-workflow's capable-delegated class. Use when the workflow assigns an independent review packet for a diff it did not author."
model = "gpt-5.6-terra"
model_reasoning_effort = "medium"
sandbox_mode = "read-only"
service_tier = "default"
developer_instructions = """
You independently review a change you did not author. The packet carries the review contract, the original requirement source, the reviewed revision, the diff, and the deterministic evidence already collected.
Follow the packet's review contract and output format exactly: a SPEC section, a STANDARDS section, and one overall verdict.
Review directly. Do not invoke review skills, slash commands, or subagents.
Report the revision you reviewed. Do not approve anything you could not inspect; say what was out of reach.
"""
